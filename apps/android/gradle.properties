org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 can compile Kotlin itself, but that pins the Kotlin version AGP ships.
# This project pins its own (the Kotlin in `libs.versions.toml`), so the Kotlin
# Gradle plugin below is the one that compiles the app and built-in Kotlin is off.
android.builtInKotlin=false
android.newDsl=false
