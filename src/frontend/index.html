<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pereda</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="bar" data-tiny-drag>
  <div class="window-controls">
    <button id="close" class="dot close" type="button" title="Close" aria-label="Close the window"></button>
    <button id="minimize" class="dot minimize" type="button" title="Minimize" aria-label="Minimize the window"></button>
    <button id="zoom" class="dot zoom" type="button" title="Zoom" aria-label="Zoom the window"></button>
  </div>

  <nav class="tools" aria-label="Notes">
    <button id="today" class="icon" type="button" title="Today" aria-label="Today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="search" class="icon" type="button" title="Search" aria-label="Search" aria-expanded="false">
      <svg class="find" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <svg class="close" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10"/><path d="M17 7 7 17"/></svg>
    </button>
  </nav>
</header>

<div id="app" class="app">
  <div id="searchbar" class="search" hidden>
    <label class="date" for="query">Search</label>
    <input id="query" class="field" type="search" placeholder="Any word in a note" autocomplete="off" spellcheck="false">
  </div>

  <main id="page" class="page">
    <div id="results" class="results" hidden></div>
    <div id="log" class="log"></div>
  </main>

  <section id="assistant" class="assistant" aria-live="polite" hidden>
    <div class="assistant-head">
      <span class="assistant-mark">Generated on this Mac</span>
      <button id="assistant-close" class="assistant-close" type="button" title="Close the summary" aria-label="Close the summary">×</button>
    </div>
    <p id="assistant-text" class="assistant-text"></p>
  </section>

  <p id="status" class="status" role="status"></p>
</div>

<div id="fatal" class="fatal" hidden>
  <div class="fatal-body">
    <h1>Pereda cannot open its notes</h1>
    <p id="fatal-message"></p>
    <p class="hint">The file was not changed. Move it aside or restore a backup, then open Pereda again.</p>
  </div>
</div>
</body>
</html>
