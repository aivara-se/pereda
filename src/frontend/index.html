<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pereda</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app" class="app">
  <header class="bar">
    <p id="date" class="date"></p>
    <nav class="tools" aria-label="Note">
      <button id="previous" class="icon" type="button" title="Previous day" aria-label="Previous day">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="next" class="icon" type="button" title="Next day" aria-label="Next day">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button id="today" class="icon" type="button" title="Today" aria-label="Today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="delete" class="icon danger" type="button" title="Delete this note" aria-label="Delete this note" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14"/><path d="M10 7V5h4v2"/><path d="M7 7l1 12h8l1-12"/></svg>
      </button>
    </nav>
  </header>

  <main class="page">
    <textarea id="note" aria-label="The note" spellcheck="true" placeholder="What happened?" disabled></textarea>
  </main>

  <p id="status" class="status" role="status"></p>
</div>

<div id="fatal" class="fatal" hidden>
  <div class="fatal-body">
    <h1>Pereda cannot open its notes</h1>
    <p id="fatal-message"></p>
    <p class="hint">The file was not changed. Move it aside or restore a backup, then open Pereda again.</p>
  </div>
</div>
</body>
</html>
