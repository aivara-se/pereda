name: poc-gpuix-macos

# The POC build: the gpuix-svelte port of Pereda, as one macOS arm64 .app.
# Dispatch it by hand, or let a push to the POC branch rebuild it.

on:
  workflow_dispatch:
  push:
    branches: [poc/gpuix-svelte]
    paths:
      - 'gpuix/**'
      - '.github/workflows/poc-gpuix-macos.yml'

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gpuix
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test the store and the day
        run: bun test

      - name: Build the app
        run: bun run build:app

      # The addon ships beside the executable, so a missing or unloadable one only
      # shows up at launch: run it, wait for the tree to mount, then end it.
      - name: Run the app
        run: |
          log=$(mktemp)
          ./dist/Pereda.app/Contents/MacOS/Pereda >"$log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            grep -q 'mount complete' "$log" && break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$log"
          grep -q 'mount complete' "$log" || { echo 'the app did not mount'; exit 1; }

      - name: Package
        run: ditto -c -k --keepParent dist/Pereda.app Pereda-1.0.0-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pereda-gpuix-macos-arm64
          path: gpuix/Pereda-1.0.0-macos-arm64.zip
          if-no-files-found: error
