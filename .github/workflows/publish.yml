name: publish

# Optional: the version in tinyjs.json on main is the release. A push that
# changes it builds the three platforms, tags the commit and publishes the
# release; a push that does not is a run that reads the file and stops.
#
# The workflow itself lives in aivara-se/.github, whose docs/RELEASES.md is the
# standard and lists the signing and notary secrets.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    uses: aivara-se/.github/.github/workflows/tinyjs-publish.yml@main
    secrets: inherit
