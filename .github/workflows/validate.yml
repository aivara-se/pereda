name: validate

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        run: bun fmt --no-script --check .
      - name: Test
        run: bun test

      # The toolchain is 12 MB and the WebKitGTK runtime 44.7 MB, fetched on
      # every run. The key is the release the installer would install, not the
      # installer URL: that URL never changes, so the key would freeze the
      # toolchain at whatever the first run cached.
      - name: Resolve the tinyjs release
        id: tinyjs
        run: |
          set -euo pipefail
          tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/tarwin/tinyjsapp/releases/latest)
          tag=${tag##*/}
          case "$tag" in
            v[0-9]*) ;;
            *) echo "could not resolve the latest tinyjs release: '$tag'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache the toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.tinyjs
          key: tinyjs-${{ runner.os }}-${{ runner.arch }}-${{ steps.tinyjs.outputs.tag }}

      # The installer refuses to run on Linux without WebKitGTK, and nothing
      # else here reads the runtime: the build reads ~/.tinyjs. So the runtime
      # is installed only when the installer runs.
      - name: Install tinyjs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0
          curl -fsSL https://tinyjs.app/install | TINYJS_NO_MODIFY_PATH=1 sh

      - name: Build
        run: ~/.tinyjs/tinyjs build
        working-directory: apps/desktop

  # The web app has its own build and its own runner: a broken page is red on
  # main like a broken app is.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build:web

  # A pull request that changes no app code costs the Mac nothing. The diff the
  # pull request makes against its base is read on Linux, and `app` is true only
  # when `apps/`, `packages/` or the lockfile moved.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE...$HEAD" -- apps libs bun.lock; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  # The .app a reviewer runs before the merge: the build the release makes for
  # Apple silicon, kept as a workflow artifact rather than published. The signing
  # secrets are not used here, so it is ad-hoc signed and the first open is a
  # right click, then Open.
  macos:
    needs: [validate, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install tinyjs
        run: |
          curl -fsSL https://tinyjs.app/install | TINYJS_NO_MODIFY_PATH=1 sh
          echo "$HOME/.tinyjs" >> "$GITHUB_PATH"

      - name: Build
        run: tinyjs build --arch arm64
        working-directory: apps/desktop

      - name: Package
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          name=$(jq -r .name apps/desktop/tinyjs.json)
          title=$(jq -r '.title // .name' apps/desktop/tinyjs.json)
          ditto -c -k --keepParent "apps/desktop/dist/$title.app" "$name-pr-$PR-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: "*.zip"
          if-no-files-found: error
